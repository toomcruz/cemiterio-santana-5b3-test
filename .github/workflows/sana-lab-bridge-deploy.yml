name: SANA LAB — deploy bridge privada

on:
  push:
    branches: [sana-lab-exumacao-f0-f2]
    paths:
      - .github/workflows/sana-lab-bridge-deploy.yml
      - deno.json
      - sana-lab/**
      - santana-authority/**
      - santana-authority-gateway/**
      - santana-conversation-domain/**
      - conformidade/**
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit completo (deve ser o HEAD da branch LAB)
        required: true
        type: string
      mode:
        description: Deploy normal ou prova controlada de rollback LAB
        required: true
        type: choice
        options: [deploy, rollback-test]
        default: deploy

permissions:
  contents: read

concurrency:
  group: sana-lab-bridge-deploy
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/sana-lab-exumacao-f0-f2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      target_sha: ${{ steps.commit.outputs.target_sha }}
      mode: ${{ steps.commit.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fixar commit da branch LAB
        id: commit
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -Eeuo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          echo "target_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          mode=deploy
          if [[ "$GITHUB_EVENT_NAME" == push && $(git log -1 --format=%s) == '[sana-lab-rollback-test]' ]]; then
            mode=rollback-test
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            mode="$REQUESTED_MODE"
          fi
          [[ "$mode" == deploy || "$mode" == rollback-test ]]
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Testar engine, ponte e procedimento de deploy LAB
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n sana-lab/deploy-functional-gate.sh sana-lab/ssh-dispatch.sh \
            sana-lab/deploy-entry.sh sana-lab/bootstrap-deploy-access.sh
          deno check sana-lab/deploy-probe.ts
          deno test --allow-read --allow-write --allow-net \
            --allow-env=SANTANA_CATALOGO_OFICIAL,SANTANA_REPO_ROOT,SANTANA_PERFIL_EXUMACAO \
            sana-lab/tests santana-conversation-domain/runtime/tests/official_journey_integration_test.ts
          python3 sana-lab/tests/deploy_automation_test.py
      - name: Testar inicialização da imagem em container efêmero sem rede externa
        shell: bash
        run: |
          set -Eeuo pipefail
          image="sana-lab-smoke:${GITHUB_SHA:0:12}"
          state="$RUNNER_TEMP/sana-lab-smoke-state"
          token_file="$RUNNER_TEMP/sana-lab-smoke-token"
          mkdir -m 0777 "$state"
          printf 'synthetic-ci-only-token-0123456789-abcdef\n' > "$token_file"
          chmod 0644 "$token_file"
          docker build -f sana-lab/Dockerfile -t "$image" .
          docker run -d --name sana-lab-smoke --network none --read-only --user 1000:1000 \
            --mount "type=bind,src=$state,dst=/lab-state" \
            --mount "type=bind,src=$token_file,dst=/run/secrets/sana_lab_token,readonly" \
            -e SANA_LAB_STATE_DIR=/lab-state -e SANA_LAB_BIND_HOST=0.0.0.0 \
            -e SANA_LAB_PORT=8765 -e SANA_LAB_TOKEN_FILE=/run/secrets/sana_lab_token \
            "$image" >/dev/null
          trap 'docker logs --tail 35 sana-lab-smoke 2>&1 || true; docker rm -f sana-lab-smoke >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in {1..20}; do
            if docker exec sana-lab-smoke deno eval \
              'const r=await fetch("http://127.0.0.1:8765/lab/v1/turn",{method:"POST"}); if(r.status!==401)throw Error("UNEXPECTED_HTTP_"+r.status)' >/dev/null 2>&1; then
              ready=1; break
            fi
            if (( attempt == 20 )); then break; fi
            sleep 0.5
          done
          test "$ready" = 1 || { echo 'LAB_DOCKER_SMOKE_FAILED' >&2; exit 2; }
          docker exec sana-lab-smoke deno run --allow-read=/run/secrets/sana_lab_token --allow-net=127.0.0.1:8765 \
            /app/sana-lab/deploy-probe.ts "$GITHUB_SHA"
          echo 'LAB_DOCKER_SMOKE_OK HTTP=401 PUBLIC_PORTS=NO'

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/sana-lab-exumacao-f0-f2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sana-lab
    env:
      TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
      MODE: ${{ needs.validate.outputs.mode }}
      DEPLOY_HOST: ${{ vars.SANA_LAB_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.SANA_LAB_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.SANA_LAB_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SANA_LAB_SSH_KNOWN_HOSTS }}
    steps:
      - name: Verificar configuração isolada de acesso
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MODE" == deploy || "$MODE" == rollback-test ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_USER" = sana-lab-deploy
          test -n "$SSH_KEY" || { echo 'SANA_LAB_DEPLOY_SSH_KEY_MISSING' >&2; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'SANA_LAB_SSH_KNOWN_HOSTS_MISSING' >&2; exit 2; }
      - name: Implantar apenas bridge privada e confirmar resultado
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          key="$RUNNER_TEMP/sana-lab-deploy-key"
          known="$RUNNER_TEMP/sana-lab-known-hosts"
          log="$RUNNER_TEMP/sana-lab-deploy-result"
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known"
          ssh-keygen -F "$DEPLOY_HOST" -f "$known" >/dev/null || {
            echo 'PINNED_HOST_KEY_MISSING' >&2; exit 2;
          }
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known" -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i "$key" \
            "$DEPLOY_USER@$DEPLOY_HOST" "$MODE $TARGET_SHA" | tee "$log"
          if [[ "$MODE" == deploy ]]; then
            grep -Fq "DEPLOY_OK COMMIT=$TARGET_SHA " "$log"
          else
            grep -Fq 'ROLLBACK_CONFIRMED=YES ' "$log"
            if grep -Fq 'DEPLOY_OK ' "$log"; then
              echo 'UNEXPECTED_DEPLOY_DURING_ROLLBACK_TEST' >&2
              exit 1
            fi
          fi
