name: SANA LAB — deploy bridge privada

on:
  push:
    branches: [sana-lab-exumacao-f0-f2]
    paths:
      - .github/workflows/sana-lab-bridge-deploy.yml
      - deno.json
      - sana-lab/**
      - santana-authority/**
      - santana-authority-gateway/**
      - santana-conversation-domain/**
      - conformidade/**
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit completo (deve ser o HEAD da branch LAB)
        required: true
        type: string
      mode:
        description: Deploy, rollback controlado ou consulta de diagnóstico sanitizado
        required: true
        type: choice
        options: [deploy, rollback-test, diagnose]
        default: deploy

permissions:
  contents: read

concurrency:
  group: sana-lab-bridge-deploy
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/sana-lab-exumacao-f0-f2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      target_sha: ${{ steps.commit.outputs.target_sha }}
      mode: ${{ steps.commit.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fixar commit da branch LAB
        id: commit
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -Eeuo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          echo "target_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          mode=deploy
          if [[ "$GITHUB_EVENT_NAME" == push && $(git log -1 --format=%s) == '[sana-lab-rollback-test]' ]]; then
            mode=rollback-test
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            mode="$REQUESTED_MODE"
          fi
          [[ "$mode" == deploy || "$mode" == rollback-test || "$mode" == diagnose ]]
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Testar engine, ponte e procedimento de deploy LAB
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n sana-lab/deploy-functional-gate.sh sana-lab/ssh-dispatch.sh \
            sana-lab/deploy-entry.sh sana-lab/install-reviewed-deploy-scripts.sh \
            sana-lab/tests/docker_preflight_integration.sh
          deno check sana-lab/deploy-probe.ts
          deno check sana-lab/start.ts sana-lab/startup_diagnostic.ts
          deno test --allow-read --allow-write --allow-net \
            --allow-env=SANTANA_CATALOGO_OFICIAL,SANTANA_REPO_ROOT,SANTANA_PERFIL_EXUMACAO \
            sana-lab/tests santana-conversation-domain/runtime/tests/official_journey_integration_test.ts
          python3 sana-lab/tests/deploy_automation_test.py
      - name: Testar preflight completo em Docker isolado e remover todos os recursos
        shell: bash
        run: |
          set -Eeuo pipefail
          image="sana-lab-smoke:${GITHUB_SHA:0:12}"
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f sana-lab/Dockerfile -t "$image" .
          bash sana-lab/tests/docker_preflight_integration.sh "$GITHUB_SHA" "$image"

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/sana-lab-exumacao-f0-f2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sana-lab
    env:
      TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
      MODE: ${{ needs.validate.outputs.mode }}
      DEPLOY_HOST: ${{ vars.SANA_LAB_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.SANA_LAB_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.SANA_LAB_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SANA_LAB_SSH_KNOWN_HOSTS }}
    steps:
      - name: Verificar configuração isolada de acesso
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MODE" == deploy || "$MODE" == rollback-test || "$MODE" == diagnose ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_USER" = sana-lab-deploy
          test -n "$SSH_KEY" || { echo 'SANA_LAB_DEPLOY_SSH_KEY_MISSING' >&2; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'SANA_LAB_SSH_KNOWN_HOSTS_MISSING' >&2; exit 2; }
      - name: Implantar apenas bridge privada ou consultar diagnóstico restrito
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          key="$RUNNER_TEMP/sana-lab-deploy-key"
          known="$RUNNER_TEMP/sana-lab-known-hosts"
          log="$RUNNER_TEMP/sana-lab-deploy-result"
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known"
          ssh-keygen -F "$DEPLOY_HOST" -f "$known" >/dev/null || {
            echo 'PINNED_HOST_KEY_MISSING' >&2; exit 2;
          }
          ssh_options=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known" -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i "$key")
          # shellcheck disable=SC2029 # Send the two validated fields to the forced-command parser on the server.
          if ! ssh "${ssh_options[@]}" \
            "$DEPLOY_USER@$DEPLOY_HOST" "$MODE $TARGET_SHA" >"$log" 2>&1; then
            # The original command can print Docker errors; show only fixed
            # control markers, then request the stored sanitized record.
            grep -E '^(DEPLOY_FAILED_STAGE=|PREFLIGHT_[A-Z0-9_]+=|ROLLBACK_CONFIRMED=|DEPLOY_SCRIPT_UPDATE_NEEDS_BOOTSTRAP|LAB_DEPLOY_COMMAND_REJECTED|DIAGNOSTIC_CAPTURE_FAILED|STARTUP_DIAGNOSTIC)' "$log" || true
            if [[ "$MODE" == deploy ]]; then
              # shellcheck disable=SC2029 # The forced command accepts only diagnose plus the validated full SHA.
              ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "diagnose $TARGET_SHA" ||
                echo 'LAB_DIAGNOSTIC_QUERY_UNAVAILABLE'
            fi
            exit 1
          fi
          if [[ "$MODE" == diagnose ]]; then
            cat "$log"
            exit 0
          fi
          grep -E '^(DEPLOY_OK|PREFLIGHT_|ROLLBACK_CONFIRMED=|LAB_PROBE_OK)' "$log" || true
          if [[ "$MODE" == deploy ]]; then
            grep -Fq "DEPLOY_OK COMMIT=$TARGET_SHA " "$log"
          else
            grep -Fq 'ROLLBACK_CONFIRMED=YES ' "$log"
            if grep -Fq 'DEPLOY_OK ' "$log"; then
              echo 'UNEXPECTED_DEPLOY_DURING_ROLLBACK_TEST' >&2
              exit 1
            fi
          fi
