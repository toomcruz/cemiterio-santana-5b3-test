name: 5B.3-A Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: 5B.3-A Preflight
    runs-on: ubuntu-latest
    env:
      SUPPORT_VNEXT_VALIDATION_ENV: ${{ vars.SUPPORT_VNEXT_VALIDATION_ENV }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLASSIFIER_AUTHORITY_KEY_ID: ${{ secrets.CLASSIFIER_AUTHORITY_KEY_ID }}
      CLASSIFIER_AUTHORITY_SECRET: ${{ secrets.CLASSIFIER_AUTHORITY_SECRET }}
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Setup Deno 2.1.4
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - name: Run isolated laboratory preflight
        shell: bash
        run: |
          set -u
          status_file="$(mktemp)"
          trap 'rm -f "$status_file"' EXIT

          fail_immediate() {
            echo "5B.3-A BLOQUEADA — PRÉ-FLIGHT DO LABORATÓRIO FALHOU"
            echo "ID: $1"
            echo "STEP: $2"
            echo "EXPECTED: $3"
            echo "ACTUAL: $4"
            echo "CORREÇÃO NECESSÁRIA: $5"
            exit 1
          }

          record() {
            printf '%s: %s\n' "$1" "$2" >> "$status_file"
          }

          sanitize_diagnostic() {
            sed -E \
              -e 's#postgres(ql)?://[^[:space:]]+#postgresql://[REDACTED]#g' \
              -e 's#https?://[^[:space:]]+#https://[REDACTED]#g' \
              -e 's#(SUPABASE_SERVICE_ROLE_KEY|DATABASE_URL|CLASSIFIER_AUTHORITY_KEY_ID|CLASSIFIER_AUTHORITY_SECRET)=[^[:space:]]+#\\1=[REDACTED]#g' \
              -e 's#(password|passwd|secret|token|apikey)[=:][^[:space:]]+#\\1=[REDACTED]#gi' \
              | sed -n '1,20p'
          }

          run_check() {
            local id="$1" step="$2" expected="$3" correction="$4" command_text="$5"
            shift 5
            local output_file rc
            output_file="$(mktemp)"
            if "$@" >"$output_file" 2>&1; then
              rc=0
              record "$step" "PASS"
            else
              rc=$?
              record "$step" "FAIL"
              {
                echo "ID: $id"
                echo "STEP: $step"
                echo "COMMAND: $command_text"
                echo "EXIT CODE: $rc"
                echo "EXPECTED: $expected"
                echo "ACTUAL/ERROR CATEGORY: COMMAND_FAILURE"
                echo "CORREÇÃO NECESSÁRIA: $correction"
                echo "DIAGNOSTIC (sanitized):"
                sanitize_diagnostic <"$output_file"
              } >&2
            fi
            rm -f "$output_file"
          }

          classify_pg_error() {
            local diagnostic="$1"
            local lower
            lower="$(printf '%s' "$diagnostic" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              *"could not translate host name"*|*"name or service not known"*|*"nodename nor servname"*) echo "DNS/HOST" ;;
              *"password authentication failed"*|*"no password supplied"*|*"authentication failed"*) echo "AUTHENTICATION" ;;
              *"ssl"*|*"certificate"*|*"tls"*) echo "SSL" ;;
              *"connection refused"*|*"timeout"*|*"timed out"*|*"network is unreachable"*) echo "NETWORK" ;;
              *"database"*|*"does not exist"*) echo "DATABASE" ;;
              *"invalid connection option"*|*"invalid dsn"*|*"malformed"*) echo "FORMAT" ;;
              *) echo "UNKNOWN" ;;
            esac
          }

          [[ "${SUPPORT_VNEXT_VALIDATION_ENV:-}" == "ISOLATED_5B3" ]] || fail_immediate "5B3-ENV-01" "Environment guard" "ISOLATED_5B3" "valor ausente ou diferente" "configurar SUPPORT_VNEXT_VALIDATION_ENV=ISOLATED_5B3"
          case "${SUPABASE_URL:-}" in
            "https://qyrxpbvdmpftfcygsmws.supabase.co"|"https://qyrxpbvdmpftfcygsmws.supabase.co/") ;;
            *) fail_immediate "5B3-ENV-02" "Expected Supabase project" "qyrxpbvdmpftfcygsmws" "projeto diferente ou ausente" "configurar SUPABASE_URL do laboratório" ;;
          esac

          for required in SUPABASE_SERVICE_ROLE_KEY DATABASE_URL CLASSIFIER_AUTHORITY_KEY_ID CLASSIFIER_AUTHORITY_SECRET; do
            [[ -n "${!required:-}" ]] || fail_immediate "5B3-CONFIG-01" "Required configuration" "$required presente" "ausente" "configurar o GitHub Secret correspondente"
          done

          echo "commit SHA: ${GITHUB_SHA}"
          echo "branch: ${GITHUB_REF_NAME}"
          echo "migrations: $(find database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)"

          run_check "5B3-DENO-01" "Deno version" "2.1.4" "corrigir setup do Deno" "deno --version; semantic version extraction" bash -c '[[ "$(deno --version | awk "$1 == \"deno\" { print $2; exit }")" == "2.1.4" ]]'
          run_check "5B3-SHELL-01" "Shell scripts" "bash syntax valid" "corrigir sintaxe dos scripts" "bash -n four preflight scripts" bash -c 'bash -n tests/postgres/run_all.sh && bash -n tests/postgres/run_concurrency.sh && bash -n tests/postgres/verify_static.sh && bash -n tests/postgres/verify_migration_manifest.sh'
          run_check "5B3-STATIC-01" "Static package verification" "static verifier exit code 0" "corrigir falha real do verificador estático" "tests/postgres/verify_static.sh" tests/postgres/verify_static.sh
          run_check "5B3-MANIFEST-01" "Migration manifest" "migrations 0001–0014, sem lacunas ou duplicação" "corrigir manifesto/migrations" "bash tests/postgres/verify_migration_manifest.sh" bash tests/postgres/verify_migration_manifest.sh
          run_check "5B3-FMT-01" "Deno fmt" "exit code 0" "corrigir formatação real reportada pelo Deno" "deno fmt --check edge-functions contracts tests" deno fmt --check edge-functions contracts tests
          run_check "5B3-LINT-01" "Deno lint" "exit code 0" "corrigir lint real reportado pelo Deno" "deno lint edge-functions contracts tests" deno lint edge-functions contracts tests
          run_check "5B3-CHECK-01" "Deno check" "exit code 0 nos entrypoints do shadow-static.yml" "corrigir type-check real reportado pelo Deno" "deno check edge-functions/*/index.ts contracts/*.ts" bash -c 'deno check edge-functions/*/index.ts contracts/*.ts'
          run_check "5B3-TEST-01" "Deno unit tests" "exit code 0 para tests/unit e tests/shadow" "corrigir teste unitário/estático real reportado pelo Deno" "deno test --allow-env --allow-read --no-net tests/unit tests/shadow" deno test --allow-env --allow-read --no-net tests/unit tests/shadow
          run_check "5B3-PG-01" "PostgreSQL client" "psql client disponível, sem servidor local" "instalar somente postgresql-client" "psql --version" bash -c 'command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null); psql --version >/dev/null'

          pg_probe="$(mktemp)"
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc 'select 1' >"$pg_probe" 2>&1; then
            record "PostgreSQL connectivity" "PASS"
            pg_connected=true
          else
            pg_rc=$?
            pg_diag="$(cat "$pg_probe")"
            pg_category="$(classify_pg_error "$pg_diag")"
            record "PostgreSQL connectivity" "FAIL"
            pg_connected=false
            {
              echo "ID: 5B3-DB-01"
              echo "STEP: PostgreSQL connectivity"
              echo 'COMMAND: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc "select 1"'
              echo "EXIT CODE: $pg_rc"
              echo "EXPECTED: PostgreSQL responde"
              echo "ACTUAL/ERROR CATEGORY: $pg_category"
              echo "CORREÇÃO NECESSÁRIA: revisar somente a categoria $pg_category na configuração do laboratório"
            } >&2
          fi
          rm -f "$pg_probe"

          if [[ "$pg_connected" == true ]]; then
            schema_probe="$(mktemp)"
            if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc "select exists (select 1 from pg_namespace where nspname = 'support_vnext_shadow')" >"$schema_probe" 2>/dev/null; then
              schema_exists="$(tr -d '[:space:]' <"$schema_probe")"
              if [[ "$schema_exists" == "f" ]]; then
                record "support_vnext_shadow absent" "PASS"
              else
                record "support_vnext_shadow absent" "FAIL"
                printf '%s\\n' 'ID: 5B3A-DB-NOT-CLEAN' 'STEP: support_vnext_shadow absent' 'COMMAND: pg_namespace existence query' 'EXIT CODE: 0' 'EXPECTED: schema ausente' 'ACTUAL/ERROR CATEGORY: DATABASE_NOT_CLEAN' 'CORREÇÃO NECESSÁRIA: usar laboratório descartável limpo; não executar DROP SCHEMA' >&2
              fi
            else
              record "support_vnext_shadow absent" "FAIL"
              printf '%s\\n' 'ID: 5B3-DB-02' 'STEP: support_vnext_shadow absent' 'COMMAND: pg_namespace existence query' 'EXIT CODE: non-zero' 'EXPECTED: consulta concluída' 'ACTUAL/ERROR CATEGORY: DATABASE' 'CORREÇÃO NECESSÁRIA: revisar conectividade/permissão do laboratório' >&2
            fi
            rm -f "$schema_probe"
          else
            record "support_vnext_shadow absent" "NOT EXECUTED"
            printf '%s\\n' 'ID: 5B3-DB-DEPENDENCY-01' 'STEP: support_vnext_shadow absent' 'COMMAND: not executed' 'EXIT CODE: N/A' 'EXPECTED: somente após connectivity PASS' 'ACTUAL/ERROR CATEGORY: DATABASE CONNECTION FAILED' 'CORREÇÃO NECESSÁRIA: corrigir PostgreSQL connectivity e executar novamente' >&2
          fi

          record "Environment guard" "PASS"
          record "Expected Supabase project" "PASS"
          record "Service role configured" "PASS"
          record "HMAC test configuration" "PASS"

          echo
          echo "5B.3-A PREFLIGHT"
          cat "$status_file"
          if grep -q ': FAIL$' "$status_file"; then
            echo "5B.3-A BLOQUEADA — PRÉ-FLIGHT DO LABORATÓRIO FALHOU"
            exit 1
          fi
          echo "5B.3-A PASS — LABORATÓRIO ISOLADO PRONTO PARA EXECUÇÃO DINÂMICA"
