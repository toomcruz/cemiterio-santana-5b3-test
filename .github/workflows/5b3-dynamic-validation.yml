name: 5B.3 Dynamic Validation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite RUN_DYNAMIC_5B3 para executar P00/P01-P15 e P23-P26"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: 5b3-isolated-lab
  cancel-in-progress: false

jobs:
  dynamic-validation:
    name: P00/P01-P15 + P23-P26 dynamic validation
    runs-on: ubuntu-latest
    env:
      SUPPORT_VNEXT_VALIDATION_ENV: ISOLATED_5B3
      SUPPORT_VNEXT_TEST_ENV: "1"
      EXPECTED_PROJECT_REF: qyrxpbvdmpftfcygsmws
      PACKAGE_PIN: dc7bf2798f88b5956f28d1c381bc083b3849dfdf
    steps:
      - name: Validate explicit confirmation
        shell: bash
        env:
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          confirmation="$CONFIRMATION_INPUT"
          confirmation_len="${#confirmation}"
          has_cr=false
          has_lf=false
          has_edge_space=false
          [[ "$confirmation" == *$'\r'* ]] && has_cr=true
          [[ "$confirmation" == *$'\n'* ]] && has_lf=true
          case "$confirmation" in
            " "*|*" ") has_edge_space=true ;;
          esac
          printf 'CONFIRMATION INPUT DEFINED: %s\nCONFIRMATION INPUT LENGTH: %s\nCONFIRMATION INPUT EXACT MATCH: %s\nCONFIRMATION INPUT CR: %s\nCONFIRMATION INPUT LF: %s\nCONFIRMATION INPUT EDGE SPACE: %s\n' \
            "$([[ -n "$confirmation" ]] && echo YES || echo NO)" \
            "$confirmation_len" \
            "$([[ "$confirmation" == "RUN_DYNAMIC_5B3" ]] && echo YES || echo NO)" \
            "$has_cr" "$has_lf" "$has_edge_space"
          if [[ "$confirmation" != "RUN_DYNAMIC_5B3" ]]; then
            echo "5B.3-C BLOCKED — invalid explicit confirmation" >&2
            exit 1
          fi
          echo "CONFIRMATION: PASS" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Initialize failure evidence
        if: always()
        shell: bash
        env:
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          evidence="$GITHUB_WORKSPACE/5b3-dynamic-validation-evidence.txt"
          confirmation_status=FAIL
          blocking_gate="Validate explicit confirmation"
          if [[ "$CONFIRMATION_INPUT" == "RUN_DYNAMIC_5B3" ]]; then
            confirmation_status=PASS
            blocking_gate="not yet determined"
          fi
          printf 'RUN ID: %s\nGITHUB SHA: %s\nCONFIRMATION: %s\nBLOCKING GATE: %s\nTIMESTAMP UTC: %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$confirmation_status" "$blocking_gate" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$evidence"

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client ripgrep
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Static gate
        run: |
          set -Eeuo pipefail
          bash tests/postgres/verify_migration_manifest.sh
          bash tests/postgres/verify_static.sh
          bash -n tests/postgres/run_all.sh tests/postgres/run_concurrency.sh
          deno fmt --check edge-functions contracts tests
          deno lint edge-functions contracts tests
          deno check edge-functions/*/index.ts contracts/*.ts
          deno test --allow-env --allow-read tests/unit tests/shadow
          [[ -f tests/postgres/p00_uuid_array_validator.sql ]] && echo "STATIC TEST A: PASS"
          [[ -f tests/postgres/p15_privileges.sql ]] && echo "STATIC TEST B: PASS"

      - name: Static proof of dynamic fail-closed order
        shell: bash
        run: |
          set -Eeuo pipefail
          expect_block() { local label="$1"; shift; if "$@"; then echo "STATIC TEST $label: FAIL"; exit 1; else echo "STATIC TEST $label: PASS"; fi; }
          expect_pass() { local label="$1"; shift; if "$@"; then echo "STATIC TEST $label: PASS"; else echo "STATIC TEST $label: FAIL"; exit 1; fi; }
          db_guard() { [[ "${1-}" == present ]]; }
          gate_chain() { [[ "$1" == pass && "$2" == pass && "$3" == pass ]]; }
          expect_block A db_guard absent
          expect_block B db_guard empty
          expect_block C gate_chain fail pass pass
          expect_block D gate_chain pass fail pass
          expect_block E gate_chain pass pass fail
          expect_block F gate_chain pass pass fail
          expect_block G gate_chain pass fail pass
          expect_block H gate_chain pass fail pass
          expect_pass I gate_chain pass pass pass
          expect_block J gate_chain pass pass fail
          echo "STATIC DYNAMIC PROOF: PASS (A-J)"

      - name: Pre-dynamic guard and identity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          set -Eeuo pipefail
          [[ "$SUPPORT_VNEXT_VALIDATION_ENV" == ISOLATED_5B3 ]] || { echo "5B.3-C BLOCKED — ENVIRONMENT GUARD"; exit 1; }
          project_url="${SUPABASE_URL:-}"
          [[ -n "$project_url" ]] || { echo "5B.3-C BLOCKED — PROJECT REF MISSING"; exit 1; }
          project_exact=false
          case "$project_url" in
            "https://qyrxpbvdmpftfcygsmws.supabase.co"|"https://qyrxpbvdmpftfcygsmws.supabase.co/") project_exact=true ;;
          esac
          project_len="$(printf '%s' "$project_url" | wc -c | tr -d ' ')"
          printf 'PROJECT URL LENGTH: %s\n' "$project_len"
          project_has_crlf=false
          [[ "$project_url" == *$'\r'* || "$project_url" == *$'\n'* ]] && project_has_crlf=true
          [[ "$project_exact" == true && "$project_has_crlf" == false ]] || { echo "5B.3-C BLOCKED — PROJECT REF MISMATCH"; exit 1; }
          q() { psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc "$1"; }
          db="$(q 'select current_database();')"; user="$(q 'select current_user;')"
          addr="$(q "select coalesce(inet_server_addr()::text, 'local');")"; port="$(q 'select inet_server_port();')"; ver="$(q 'show server_version;')"
          [[ "$(q "select count(*) from pg_namespace where nspname='support_vnext_shadow';")" == 1 ]] || { echo "5B.3-C BLOCKED — schema absent"; exit 1; }
          [[ "$(q "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='support_vnext_shadow' and p.proname in ('get_runtime_decision_rules','store_shadow_decision','confirm_request_transaction');")" == 3 ]] || { echo "fundamental objects incomplete"; exit 1; }
          printf '%s\n' "$db" "$user" "$addr" "$port" "$ver" > "$RUNNER_TEMP/identity"
          fp="$(sha256sum "$RUNNER_TEMP/identity" | awk '{print $1}')"
          printf 'DATABASE FINGERPRINT: %s\nSHADOW_ONLY: PASS\n' "$fp" | tee -a "$GITHUB_STEP_SUMMARY" "$GITHUB_WORKSPACE/5b3-dynamic-validation-evidence.txt"

      - name: P00 mandatory gate
        env:
          TEST_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          files=(tests/postgres/p00_*.sql)
          [[ -n "${files[*]-}" ]] || { echo "P00 FAIL"; exit 1; }
          for f in "${files[@]}"; do psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$f"; done
          echo "P00: PASS" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: P01-P09
        env:
          TEST_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -Eeuo pipefail
          root=tests/postgres
          one() { psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$root/$2"; echo "$1: PASS" | tee -a "$GITHUB_STEP_SUMMARY"; }
          conc() { CASE_SQL="$PWD/$root/$2" DATABASE_URL_A="$TEST_DATABASE_URL" DATABASE_URL_B="$TEST_DATABASE_URL" SUPPORT_VNEXT_TEST_ENV=1 "$root/run_concurrency.sh"; echo "$1 CONCURRENCY: PASS" | tee -a "$GITHUB_STEP_SUMMARY"; }
          conc P01 p01_release_overlap.sql
          one P02 p02_published_update.sql; one P03 p03_published_delete.sql; one P04 p04_content_insert_update_delete.sql
          one P05 p05_source_link_insert.sql; one P06 p06_final_states.sql; one P07 p07_explicit_rebind.sql; one P08 p08_hash_integrity.sql
          conc P09 p09_session_concurrency.sql


      - name: P10 SQL resolver boundary
        env:
          TEST_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -Eeuo pipefail
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/postgres/p10_a_confirmar.sql
          echo "P10 SQL: PASS" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: P11-P15
        env:
          TEST_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -Eeuo pipefail
          root=tests/postgres
          one() { psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$root/$2"; echo "$1: PASS" | tee -a "$GITHUB_STEP_SUMMARY"; }
          conc() { CASE_SQL="$PWD/$root/$2" DATABASE_URL_A="$TEST_DATABASE_URL" DATABASE_URL_B="$TEST_DATABASE_URL" SUPPORT_VNEXT_TEST_ENV=1 "$root/run_concurrency.sh"; echo "$1 CONCURRENCY: PASS" | tee -a "$GITHUB_STEP_SUMMARY"; }
          conc P11 p11_confirm_concurrency.sql
          one P12 p12_inbound_reuse.sql; one P13 p13_confirmation_rejections.sql; one P14 p14_complaint_closed.sql; one P15 p15_privileges.sql

      - name: P23-P26 persistencia e linguagem (5B.4-B.2 / 5B.4-C)
        shell: bash
        env:
          TEST_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -Eeuo pipefail
          root=tests/postgres
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$root/p23_roundtrip_generated.sql"
          echo "P23 round-trip 22/22: PASS" | tee -a "$GITHUB_STEP_SUMMARY"
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$root/p24_conv_persistence.sql"
          echo "P24 S01-S22: PASS" | tee -a "$GITHUB_STEP_SUMMARY"
          SUPPORT_VNEXT_TEST_ENV=1 CASE_SQL="$PWD/$root/p25_conv_concurrency.sql" \
            DATABASE_URL_A="$TEST_DATABASE_URL" DATABASE_URL_B="$TEST_DATABASE_URL" bash "$root/run_concurrency.sh"
          echo "P25 S02 concorrencia real: PASS" | tee -a "$GITHUB_STEP_SUMMARY"
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$root/p26_language_e2e_generated.sql"
          echo "P26 linguagem end-to-end: PASS" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Seed P10 integration fixture
        env:
          TEST_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -Eeuo pipefail
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/postgres/fixtures/p10_integration_fixture.sql
          echo "P10 FIXTURE: PASS" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: P10 integration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPECTED_SUPABASE_URL: https://qyrxpbvdmpftfcygsmws.supabase.co
        run: |
          set -Eeuo pipefail
          [[ "$SUPABASE_URL" == "$EXPECTED_SUPABASE_URL" ]] || { echo "5B.3-C BLOCKED — P10 endpoint is not the isolated project"; exit 1; }
          P10_INTEGRATION=1 deno test --allow-env --allow-net tests/integration/p10_a_confirmar_integration_test.ts
          echo "P10 INTEGRATION: PASS" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dynamic summary
        if: always()
        run: |
          if [[ "${{ job.status }}" == success ]]; then echo "FINAL: 5B.3 DYNAMIC VALIDATION PASS" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "FINAL: 5B.3 BLOCKED" | tee -a "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5b3-dynamic-validation-evidence
          path: 5b3-dynamic-validation-evidence.txt
          if-no-files-found: warn
