name: 5B.3-BR Reset Isolated Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    name: Controlled reset of partial laboratory
    runs-on: ubuntu-latest
    env:
      SUPPORT_VNEXT_VALIDATION_ENV: ${{ vars.SUPPORT_VNEXT_VALIDATION_ENV }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_0007_SHA256: 4ac5315ff2876f04ab73d50376075bf9c09835492c2844598a30d2be8657a2d5

    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install PostgreSQL client and audit package
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client ripgrep >/dev/null
          psql --version
          rg --version
          printf 'COMMIT SHA: %s\n' "$GITHUB_SHA"
          printf 'BRANCH: %s\n' "$GITHUB_REF_NAME"
          actual_0007_sha256="$(sha256sum database/migrations/0007_5b2c3_static_completion.sql | awk '{print $1}')"
          [[ "$actual_0007_sha256" == "$EXPECTED_0007_SHA256" ]] || {
            printf '5B.3-BR BLOCKED — corrected 0007 hash mismatch\n' >&2
            exit 1
          }
          printf '0007 SHA256: %s\n' "$actual_0007_sha256"

          printf 'STATIC OBJECT SOURCES 0001-0006\n'
          rg -n --glob 'database/migrations/000[1-6]_*.sql' \
            '^[[:space:]]*(create|alter|drop|grant|revoke)[[:space:]]+(extension|schema|table|type|index|function|procedure|trigger|role|policy|sequence)|create[[:space:]]+role|create[[:space:]]+extension' \
            database/migrations

      - name: Static proof of ownership and dependency predicates
        shell: bash
        run: |
          set -Eeuo pipefail
          is_package_role() {
            case "$1" in
              support_vnext_runtime|support_vnext_publisher|support_vnext_auditor|support_vnext_admin) return 0 ;;
              *) return 1 ;;
            esac
          }
          ownership_blocks() {
            [[ "$1" == "o" ]] && is_package_role "$2" && [[ "$3" != "support_vnext_shadow" ]]
          }
          membership_row_expected() {
            [[ "$1" == "postgres" && -n "$2" && "$3" == "true" && "$4" == "true" && "$5" == "false" && "$6" == "false" ]]
          }
          creator_set_passes() {
            [[ "$1" == "4" && "$2" == "4" && "$3" == "0" && "$4" == "1" && "$5" == "4" ]]
          }
          assert_case() {
            local label="$1" expected="$2" actual rc
            shift 2
            set +e
            "$@"
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then
              actual=PASS
            else
              actual=BLOCK
            fi
            if [[ "$actual" == "$expected" ]]; then
              printf 'STATIC TEST %s: PASS\n' "$label"
            else
              printf 'STATIC TEST %s: FAIL\nEXPECTED: %s\nACTUAL: %s\nREASON: predicate exit code %s\n' "$label" "$expected" "$actual" "$rc" >&2
              return 1
            fi
          }

          # A-H: expected creator-membership predicate, including expected BLOCK results.
          assert_case A PASS membership_row_expected postgres bootstrap_superuser true true false false
          assert_case B PASS membership_row_expected postgres different_superuser true true false false
          assert_case C BLOCK creator_set_passes 4 4 0 2 4
          assert_case D BLOCK creator_set_passes 4 4 0 1 3
          assert_case E BLOCK creator_set_passes 5 4 1 1 4
          assert_case F BLOCK membership_row_expected postgres bootstrap_superuser true false false false
          assert_case G BLOCK membership_row_expected postgres bootstrap_superuser true true true false
          assert_case H BLOCK membership_row_expected postgres bootstrap_superuser true true false true

          # Ownership/dependency proofs remain independent from membership.
          assert_case OWNERSHIP-ACL BLOCK ownership_blocks a support_vnext_runtime public
          assert_case OWNERSHIP-EXTERNAL BLOCK ownership_blocks o support_vnext_runtime public
          assert_case OWNERSHIP-PLATFORM BLOCK ownership_blocks o postgres pg_catalog
          assert_case OWNERSHIP-PACKAGE-ACL BLOCK ownership_blocks a support_vnext_publisher support_vnext_shadow
          printf 'STATIC PREDICATE PROOF: PASS (A-H + ownership/dependency)\n'

      - name: Guard and read-only pre-reset audit
        shell: bash
        run: |
          set -Eeuo pipefail

          fail() {
            printf '5B.3-BR BLOCKED — %s\n' "$1" >&2
            exit 1
          }

          [[ "${SUPPORT_VNEXT_VALIDATION_ENV:-}" == "ISOLATED_5B3" ]] || \
            fail "environment guard failed"
          case "${SUPABASE_URL:-}" in
            *qyrxpbvdmpftfcygsmws*) ;;
            *) fail "expected isolated project guard failed" ;;
          esac
          [[ -n "${DATABASE_URL:-}" ]] || fail "DATABASE_URL is not configured"

          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT

          sanitize() {
            sed -En \
              -e 's#(postgres(ql)?://)[^[:space:]]+#\1[REDACTED]#g' \
              -e 's#(credential|passwd|secret|token|apikey)[=:][^[:space:]]+#\1=[REDACTED]#gi' \
              -e '1,30p' "$1"
          }

          set +e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc 'select 1;' \
            >"$audit_dir/connection.out" 2>"$audit_dir/connection.err"
          connection_rc=$?
          set -e
          [[ "$connection_rc" -eq 0 ]] || {
            printf 'STEP: connection\nOBJECT: database\nCOMMAND CATEGORY: read-only probe\nEXIT CODE: %s\nERROR CATEGORY: sanitized connection failure\n' "$connection_rc" >&2
            sanitize "$audit_dir/connection.err" >&2
            exit "$connection_rc"
          }
          printf 'DATABASE CONNECTION: PASS\n'

          printf 'CURRENT USER CREATOR AUDIT\n'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select current_user || ':SUPERUSER=' || r.rolsuper::text || ':CREATEROLE=' || r.rolcreaterole::text from pg_roles r where r.rolname=current_user;"

          schema_exists="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select exists (select 1 from pg_namespace where nspname='support_vnext_shadow');")"
          [[ "$schema_exists" == "t" ]] || fail "partial-state schema is absent"
          printf 'PARTIAL STATE: support_vnext_shadow PRESENT\n'

          printf 'SCHEMA OBJECTS\n'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select n.nspname || '.' || c.relname || ':' || c.relkind::text from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='support_vnext_shadow' order by 1;"
          printf 'SCHEMA FUNCTIONS AND PROCEDURES\n'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select n.nspname || '.' || p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')' from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='support_vnext_shadow' and p.prokind in ('f','p') order by 1;"
          printf 'SCHEMA TRIGGERS\n'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select trigger_schema || '.' || event_object_table || ':' || trigger_name from information_schema.triggers where trigger_schema='support_vnext_shadow' order by 1;"
          printf 'SCHEMA POLICIES\n'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select schemaname || '.' || tablename || ':' || policyname from pg_policies where schemaname='support_vnext_shadow' order by 1;"

          printf 'PACKAGE ROLES\n'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select rolname || ':LOGIN=' || rolcanlogin || ':SUPERUSER=' || rolsuper from pg_roles where rolname in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') order by 1;"
          printf 'ROLE MEMBERSHIPS\n'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select parent.rolname || '<-' || member.rolname || ':grantor=' || grantor.rolname || ':admin=' || m.admin_option::text || ':inherit=' || m.inherit_option::text || ':set=' || m.set_option::text from pg_auth_members m join pg_roles parent on parent.oid=m.roleid join pg_roles member on member.oid=m.member join pg_roles grantor on grantor.oid=m.grantor where parent.rolname in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') or member.rolname in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') order by 1;"
          printf 'ROLE MEMBERSHIP CLASSIFICATION\n'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select parent.rolname || '<-' || member.rolname || ':GRANTOR=' || grantor.rolname || ':GRANTOR_SUPERUSER=' || grantor.rolsuper::text || ':EXPECTED_POSTGRESQL_CREATOR_MEMBERSHIP' from pg_auth_members m join pg_roles parent on parent.oid=m.roleid join pg_roles member on member.oid=m.member join pg_roles grantor on grantor.oid=m.grantor where member.rolname='postgres' and parent.rolname in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') order by 1;"
          printf 'ROLE OWNERSHIP OUTSIDE PACKAGE SCHEMA\n'
          ownership_rows="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "with owned as (select r.rolname as role_name,n.nspname::text as schema_name,c.relname::text as object_name,'pg_class'::text as object_type from pg_roles r join pg_class c on c.relowner=r.oid join pg_namespace n on n.oid=c.relnamespace union all select r.rolname,n.nspname::text,p.proname::text,'pg_proc'::text from pg_roles r join pg_proc p on p.proowner=r.oid join pg_namespace n on n.oid=p.pronamespace union all select r.rolname,n.nspname::text,t.typname::text,'pg_type'::text from pg_roles r join pg_type t on t.typowner=r.oid join pg_namespace n on n.oid=t.typnamespace union all select r.rolname,n.nspname::text,n.nspname::text,'pg_namespace'::text from pg_roles r join pg_namespace n on n.nspowner=r.oid union all select r.rolname,null::text,d.datname::text,'pg_database'::text from pg_roles r join pg_database d on d.datdba=r.oid union all select r.rolname,null::text,ts.spcname::text,'pg_tablespace'::text from pg_roles r join pg_tablespace ts on ts.spcowner=r.oid) select role_name || ':' || object_type || ':' || coalesce(schema_name || '.', '') || object_name from owned where schema_name is null or schema_name <> 'support_vnext_shadow' order by 1;")"
          if [[ -n "$ownership_rows" ]]; then
            printf '%s\n' "$ownership_rows"
          else
            printf 'NONE\n'
          fi
          printf 'ROLE SHARED DEPENDENCIES\n'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select r.rolname || ':deptype=' || d.deptype::text || ':dependency_class=' || case d.deptype when 'o' then 'OWNER' when 'a' then 'ACL' when 'i' then 'INITACL' when 'r' then 'POLICY' else 'OTHER' end || ':object_type=' || coalesce((pg_identify_object(d.classid,d.objid,d.objsubid)).type,'UNKNOWN') || ':schema=' || coalesce((pg_identify_object(d.classid,d.objid,d.objsubid)).schema,'') || ':object_identity=' || coalesce((pg_identify_object(d.classid,d.objid,d.objsubid)).identity,'UNKNOWN') from pg_shdepend d join pg_roles r on r.oid=d.refobjid where r.rolname in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') order by 1;"
          printf 'PACKAGE SCHEMA ACLS\n'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select n.nspname || ':' || grantee.rolname || ':' || x.privilege_type || ':grantor=' || grantor.rolname || ':grantable=' || x.is_grantable::text from pg_namespace n cross join lateral aclexplode(coalesce(n.nspacl,'{}'::aclitem[])) x join pg_roles grantee on grantee.oid=x.grantee join pg_roles grantor on grantor.oid=x.grantor where n.nspname='support_vnext_shadow' and grantee.rolname in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') order by 1;"
          printf 'PACKAGE ROUTINE ACLS\n'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select p.proname || '(' || pg_get_function_identity_arguments(p.oid) || '):' || grantee.rolname || ':' || x.privilege_type || ':grantor=' || grantor.rolname || ':grantable=' || x.is_grantable::text from pg_proc p join pg_namespace n on n.oid=p.pronamespace cross join lateral aclexplode(coalesce(p.proacl,'{}'::aclitem[])) x join pg_roles grantee on grantee.oid=x.grantee join pg_roles grantor on grantor.oid=x.grantor where n.nspname='support_vnext_shadow' and grantee.rolname in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') order by 1;"
          printf 'ROLE TABLE GRANTS OUTSIDE PACKAGE SCHEMA\n'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select grantee || ':' || table_schema || '.' || table_name || ':' || privilege_type from information_schema.role_table_grants where grantee in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') and table_schema <> 'support_vnext_shadow' order by 1;"
          printf 'ROLE ROUTINE GRANTS OUTSIDE PACKAGE SCHEMA\n'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select grantee || ':' || routine_schema || '.' || routine_name || ':' || privilege_type from information_schema.role_routine_grants where grantee in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') and routine_schema <> 'support_vnext_shadow' order by 1;"

          printf 'EXTENSIONS\n'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select e.extname || ':schema=' || n.nspname || ':version=' || e.extversion from pg_extension e join pg_namespace n on n.oid=e.extnamespace order by 1;"
          printf 'PUBLIC TABLES\n'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select table_name from information_schema.tables where table_schema='public' order by 1;"

          package_external_ownership="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "with owners as (select r.rolname,(pg_identify_object(d.classid,d.objid,d.objsubid)).schema as object_schema from pg_shdepend d join pg_roles r on r.oid=d.refobjid where r.rolname in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') and d.deptype='o') select count(*) from owners where object_schema is distinct from 'support_vnext_shadow';")"
          total_package_memberships="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select count(*) from pg_auth_members m join pg_roles parent on parent.oid=m.roleid join pg_roles member on member.oid=m.member where parent.rolname in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') or member.rolname in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin');")"
          expected_memberships="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select count(*) from pg_auth_members m join pg_roles parent on parent.oid=m.roleid join pg_roles member on member.oid=m.member join pg_roles grantor on grantor.oid=m.grantor where member.rolname='postgres' and parent.rolname in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') and grantor.rolsuper is true and m.admin_option is true and m.inherit_option is false and m.set_option is false;")"
          unexpected_memberships=$((total_package_memberships - expected_memberships))
          creator_grantor="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select string_agg(distinct grantor.rolname, ',' order by grantor.rolname) from pg_auth_members m join pg_roles parent on parent.oid=m.roleid join pg_roles member on member.oid=m.member join pg_roles grantor on grantor.oid=m.grantor where member.rolname='postgres' and parent.rolname in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') and m.admin_option is true and m.inherit_option is false and m.set_option is false;")"
          creator_grantor_count="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select count(distinct m.grantor) from pg_auth_members m join pg_roles parent on parent.oid=m.roleid join pg_roles member on member.oid=m.member where member.rolname='postgres' and parent.rolname in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') and m.admin_option is true and m.inherit_option is false and m.set_option is false;")"
          creator_grantor_superuser_count="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select count(*) from pg_auth_members m join pg_roles parent on parent.oid=m.roleid join pg_roles member on member.oid=m.member join pg_roles grantor on grantor.oid=m.grantor where member.rolname='postgres' and parent.rolname in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') and grantor.rolsuper is true and m.admin_option is true and m.inherit_option is false and m.set_option is false;")"
          external_table_grants="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select count(*) from information_schema.role_table_grants where grantee in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') and table_schema <> 'support_vnext_shadow';")"
          external_routine_grants="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select count(*) from information_schema.role_routine_grants where grantee in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') and routine_schema <> 'support_vnext_shadow';")"
          external_schema_grants="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select count(*) from information_schema.role_usage_grants where grantee in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') and object_schema <> 'support_vnext_shadow';")"
          package_external_acl=$((external_table_grants + external_routine_grants + external_schema_grants))
          package_unexpected_dependency="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc \
            "select count(*) from pg_shdepend d join pg_roles r on r.oid=d.refobjid where r.rolname in ('support_vnext_runtime','support_vnext_publisher','support_vnext_auditor','support_vnext_admin') and d.deptype not in ('o','a','i','r');")"
          if [[ "$package_external_ownership" == "0" ]]; then printf 'EXTERNAL PACKAGE OWNERSHIP: NONE\n'; else printf 'EXTERNAL PACKAGE OWNERSHIP: BLOCKED (%s)\n' "$package_external_ownership"; fi
          if [[ "$package_external_acl" == "0" ]]; then printf 'EXPECTED PACKAGE ACLS: PASS\n'; else printf 'EXPECTED PACKAGE ACLS: BLOCKED (%s external)\n' "$package_external_acl"; fi
          printf 'CREATOR MEMBERSHIP TOTAL: %s\n' "$total_package_memberships"
          printf 'CREATOR MEMBERSHIP EXPECTED: %s\n' "$expected_memberships"
          printf 'CREATOR MEMBERSHIP UNEXPECTED: %s\n' "$unexpected_memberships"
          printf 'CREATOR MEMBERSHIP GRANTOR: %s\n' "$creator_grantor"
          printf 'CREATOR MEMBERSHIP GRANTOR SUPERUSER: %s\n' "$creator_grantor_superuser_count"
          if [[ "$expected_memberships" == "4" && "$unexpected_memberships" == "0" && "$creator_grantor_count" == "1" && "$creator_grantor_superuser_count" == "4" ]]; then printf 'EXPECTED CREATOR MEMBERSHIPS: PASS\n'; else printf 'EXPECTED CREATOR MEMBERSHIPS: BLOCKED\n'; fi
          if [[ "$package_unexpected_dependency" == "0" ]]; then printf 'UNEXPECTED DEPENDENCIES: NONE\n'; else printf 'UNEXPECTED DEPENDENCIES: BLOCKED (%s)\n' "$package_unexpected_dependency"; fi
          [[ "$package_external_ownership" == "0" ]] || fail "package role has real external ownership"
          [[ "$package_external_acl" == "0" ]] || fail "package role has unexplained external ACL"
          [[ "$total_package_memberships" == "4" ]] || fail "TOTAL_PACKAGE_MEMBERSHIPS count mismatch"
          [[ "$expected_memberships" == "4" ]] || fail "EXPECTED_CREATOR_MEMBERSHIPS count mismatch"
          [[ "$unexpected_memberships" == "0" ]] || fail "UNEXPECTED_EXTERNAL_MEMBERSHIP detected"
          [[ "$creator_grantor_count" == "1" ]] || fail "creator grantors differ"
          [[ "$creator_grantor_superuser_count" == "4" ]] || fail "creator grantor is not uniformly superuser"
          [[ "$package_unexpected_dependency" == "0" ]] || fail "UNEXPECTED_DEPENDENCY detected"
          printf 'PRE-RESET DEPENDENCY GUARD: PASS\n'

      - name: Remove only package schema and package roles
        shell: bash
        run: |
          set -Eeuo pipefail
          reset_log="$(mktemp)"
          trap 'rm -f "$reset_log"' EXIT
          set +e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X \
            -c 'begin; revoke support_vnext_runtime from postgres; revoke support_vnext_publisher from postgres; revoke support_vnext_auditor from postgres; revoke support_vnext_admin from postgres; revoke usage on schema support_vnext_shadow from support_vnext_runtime,support_vnext_publisher,support_vnext_auditor,support_vnext_admin; revoke execute on function support_vnext_shadow.publish_ruleset_release(uuid,text), support_vnext_shadow.transition_ruleset_release(uuid,support_vnext_shadow.ruleset_status,text,text,text,uuid), support_vnext_shadow.refresh_draft_release_content_hash(uuid,text) from support_vnext_publisher; drop schema support_vnext_shadow cascade; drop role support_vnext_runtime; drop role support_vnext_publisher; drop role support_vnext_auditor; drop role support_vnext_admin; commit;' \
            >"$reset_log" 2>&1
          reset_rc=$?
          set -e
          if [[ "$reset_rc" -ne 0 ]]; then
            sqlstate="$(grep -Eio 'SQLSTATE[^[:alnum:]]*[0-9A-Z]{5}' "$reset_log" | sed -n '1p' || true)"
            [[ -n "$sqlstate" ]] || sqlstate="unavailable"
            printf 'STEP: directed reset\nOBJECT: support_vnext_shadow/package roles\nCOMMAND CATEGORY: targeted schema and role removal\nEXIT CODE: %s\n' "$reset_rc" >&2
            printf 'SQLSTATE: %s\n' "$sqlstate" >&2
            sed -En \
              -e 's#(postgres(ql)?://)[^[:space:]]+#\1[REDACTED]#g' \
              -e 's#(credential|passwd|secret|token|apikey)[=:][^[:space:]]+#\1=[REDACTED]#gi' \
              -e '/ERROR:|FATAL:|DETAIL:|HINT:/p' "$reset_log" | sed -n '1,30p' >&2
            exit "$reset_rc"
          fi
          printf 'DIRECTED RESET: PASS\n'

      - name: Read-only post-reset verification
        shell: bash
        run: |
          set -Eeuo pipefail
          psql_read() { psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -XAtc "$1"; }

          schema_count="$(psql_read "select count(*) from pg_namespace where nspname='support_vnext_shadow';")"
