name: 1A NVIDIA preflight
# Preflight da Fase 1A, segunda rodada. Nao e benchmark, nao e a C1.
# Teto rigido de 5 chamadas reais. Fail-fast em 401/403/429. Zero retries.
# Nao toca Supabase, n8n, W-API, Vercel nem producao. Nao usa Gemini.
#
# Rodada 1 (run 32184998151) provou: a chave autentica e GET /v1/models
# devolveu 200 com 102 modelos. Mas a lista publica do catalogo NIM nao e a
# lista invocavel pela conta: 'ai21labs/jamba-1.5-large-instruct' respondeu
# 404 "Not found for account". Por isso esta rodada nao gasta chamada em
# /v1/models e nao escolhe modelo por nome: descobre acesso por tentativa.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite PREFLIGHT_NVIDIA_1A para autorizar as chamadas reais"
        required: true
        type: string
      etapa:
        description: "preflight (ate 5 chamadas) ou microverificacao de structured output (ate 2)"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - microverificacao

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://integrate.api.nvidia.com/v1
      CONFIRMATION: ${{ inputs.confirmation }}
      ETAPA: ${{ inputs.etapa }}
    steps:
      - name: Autorizacao explicita
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "$CONFIRMATION" != "PREFLIGHT_NVIDIA_1A" ]; then
            echo "confirmacao ausente ou incorreta: nada foi chamado" >&2
            exit 1
          fi
          echo "autorizacao confirmada"

      - name: Preparar credencial fora de argv e de log
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -Eeuo pipefail
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "NVIDIA_API_KEY ausente ou vazia" >&2
            exit 1
          fi
          umask 077
          # A chave vai para um arquivo de config do curl: nunca em argv (onde ps a
          # exporia), nunca em URL, nunca ecoada. Removida no fim do job.
          {
            printf 'header = "Authorization: Bearer %s"\n' "$NVIDIA_API_KEY"
            printf 'silent\n'
            printf 'show-error\n'
          } > "$RUNNER_TEMP/nv.cfg"
          echo "credencial presente (valor nao reportado)"

      - name: Probes
        if: inputs.etapa == 'preflight'
        shell: bash
        run: |
          set -Eeuo pipefail
          CFG="$RUNNER_TEMP/nv.cfg"
          CALLS=0
          MAX=5
          LAST_CODE=""
          LAST_OUT=""

          MODEL_ACCESSIBLE=FAIL
          TOOL_CALLING=FAIL
          STRUCTURED_OUTPUT=FAIL
          MODEL_OK=""

          # Uma chamada real. Fail-fast em 401/403/429. Sem retry, nunca.
          # 404 NAO e fail-fast: significa "nao invocavel nesta conta".
          call() {
            local label="$1" body="$2"
            CALLS=$((CALLS + 1))
            if [ "$CALLS" -gt "$MAX" ]; then
              echo "teto de $MAX chamadas atingido: abortando" >&2
              exit 1
            fi
            local out="$RUNNER_TEMP/out.$CALLS.json"
            local meta="$RUNNER_TEMP/meta.$CALLS.txt"
            local hdr="$RUNNER_TEMP/hdr.$CALLS.txt"
            curl -K "$CFG" -o "$out" -D "$hdr" -w '%{http_code} %{time_total}\n' \
              --max-time 120 -X POST -H 'Content-Type: application/json' \
              -d "$body" "$BASE/chat/completions" > "$meta" || true
            local code tempo
            code="$(awk '{print $1}' "$meta")"
            tempo="$(awk '{print $2}' "$meta")"
            if [ -z "$code" ]; then
              echo "CHAMADA $CALLS [$label] sem resposta HTTP (falha de transporte)" >&2
              exit 1
            fi
            echo "CHAMADA $CALLS [$label] HTTP=$code latencia=${tempo}s"
            grep -iE '^(x-ratelimit|retry-after|ratelimit)' "$hdr" || true
            case "$code" in
              401 | 403)
                echo "FAIL-FAST: credencial rejeitada ($code). Encerrando sem retry." >&2
                exit 1
                ;;
              429)
                echo "FAIL-FAST: rate limit ($code). Encerrando sem retry." >&2
                exit 1
                ;;
            esac
            LAST_CODE="$code"
            LAST_OUT="$out"
          }

          # ------------------ 1. descoberta de acesso por tentativa controlada
          # Ordem fixa, definida por decisao humana. Uma chamada simples por
          # candidato. Para no primeiro HTTP 200.
          for CAND in \
            "nvidia/llama-3.3-nemotron-super-49b-v1.5" \
            "meta/llama-3.3-70b-instruct" \
            "nvidia/nemotron-3-nano-30b-a3b"; do
            body="$(jq -nc --arg m "$CAND" '{
              model: $m, max_tokens: 16, temperature: 0,
              messages: [{role: "user", content: "Responda apenas: ok"}]
            }')"
            call "acesso:$CAND" "$body"
            if [ "$LAST_CODE" = "200" ]; then
              MODEL_OK="$CAND"
              MODEL_ACCESSIBLE=PASS
              echo "ACESSO CONFIRMADO: $CAND"
              jq -r '.choices[0].message.content // "(sem conteudo)"' "$LAST_OUT" | head -3
              break
            fi
            if [ "$LAST_CODE" = "404" ]; then
              echo "nao invocavel nesta conta: $CAND"
              jq -c '.detail // .error // .' "$LAST_OUT" 2> /dev/null | head -1 || true
              continue
            fi
            echo "resposta inesperada ($LAST_CODE) para $CAND"
            jq -c '.detail // .error // .' "$LAST_OUT" 2> /dev/null | head -1 || true
          done

          if [ -z "$MODEL_OK" ]; then
            echo "=== RESULTADO ==="
            echo "MODEL_ACCESSIBLE=FAIL"
            echo "TOOL_CALLING=FAIL"
            echo "STRUCTURED_OUTPUT=FAIL"
            echo "=== CHAMADAS REAIS EXECUTADAS: $CALLS de $MAX ==="
            echo "nenhum dos candidatos e invocavel nesta conta" >&2
            exit 1
          fi

          # ------------------------------------------------------ 2. tool calling
          # Contrato real da POC: consulta sem argumento nenhum.
          # tool_choice nomeado prova o suporte do protocolo; a escolha
          # automatica pelo modelo sera validada na C1.
          body="$(jq -nc --arg m "$MODEL_OK" '{
            model: $m, max_tokens: 128, temperature: 0,
            messages: [{role: "user", content: "Quanto custa a exumacao?"}],
            tools: [{type: "function", function: {
              name: "consultar_preco_exumacao",
              description: "Consulta o valor aplicavel da exumacao na base oficial do Cemiterio Santana.",
              parameters: {type: "object", properties: {}, required: []}
            }}],
            tool_choice: {type: "function", function: {name: "consultar_preco_exumacao"}}
          }')"
          call "tool.calling" "$body"
          if [ "$LAST_CODE" = "200" ] &&
            jq -e '.choices[0].message.tool_calls[0].function.name == "consultar_preco_exumacao"' \
              "$LAST_OUT" > /dev/null 2>&1; then
            TOOL_CALLING=PASS
            echo "TOOL CALLING: PASS"
            jq -c '.choices[0].message.tool_calls[0].function' "$LAST_OUT"
          else
            echo "TOOL CALLING: FAIL ($LAST_CODE)"
            jq -c '.detail // .error // .choices[0].message' "$LAST_OUT" 2> /dev/null | head -3 || true
          fi

          # ------------------------------------------------ 3. structured output
          body="$(jq -nc --arg m "$MODEL_OK" '{
            model: $m, max_tokens: 128, temperature: 0,
            messages: [{role: "user", content: "Extraia a intencao desta mensagem do municipe: quanto custa?"}],
            response_format: {type: "json_schema", json_schema: {
              name: "intencao", strict: true,
              schema: {
                type: "object", additionalProperties: false,
                properties: {intencao: {type: "string", enum: ["PRECO", "DOCUMENTOS", "PRAZO", "OUTRO"]}},
                required: ["intencao"]
              }
            }}
          }')"
          call "structured.output" "$body"
          if [ "$LAST_CODE" = "200" ] &&
            jq -e '.choices[0].message.content | fromjson | .intencao' "$LAST_OUT" > /dev/null 2>&1; then
            STRUCTURED_OUTPUT=PASS
            echo "STRUCTURED OUTPUT: PASS"
            jq -r '.choices[0].message.content' "$LAST_OUT"
          elif [ "$LAST_CODE" = "400" ] || [ "$LAST_CODE" = "422" ]; then
            # A API recusou o parametro: e ausencia de suporte, nao defeito nosso.
            # Registrado como UNSUPPORTED com o erro exato. Sem fallback silencioso.
            STRUCTURED_OUTPUT=UNSUPPORTED
            echo "STRUCTURED OUTPUT: UNSUPPORTED ($LAST_CODE) — erro exato abaixo"
            jq -c '.detail // .error // .' "$LAST_OUT" 2> /dev/null | head -3 || true
          else
            echo "STRUCTURED OUTPUT: FAIL ($LAST_CODE)"
            jq -c '.detail // .error // .choices[0].message' "$LAST_OUT" 2> /dev/null | head -3 || true
          fi

          # ----------------------------------------------------------- resultado
          echo "=== RESULTADO ==="
          echo "MODELO ACESSIVEL: $MODEL_OK"
          echo "MODEL_ACCESSIBLE=$MODEL_ACCESSIBLE"
          echo "TOOL_CALLING=$TOOL_CALLING"
          echo "STRUCTURED_OUTPUT=$STRUCTURED_OUTPUT"
          echo "=== CHAMADAS REAIS EXECUTADAS: $CALLS de $MAX ==="

          # O job so termina SUCCESS se houver modelo invocavel comprovado.
          # TOOL_CALLING e STRUCTURED_OUTPUT sao reportados, nao reprovam o
          # preflight: sao o dado que a decisao da C1 precisa.
          [ "$MODEL_ACCESSIBLE" = "PASS" ] || exit 1

      - name: Microverificacao de structured output
        if: inputs.etapa == 'microverificacao'
        shell: bash
        run: |
          set -Eeuo pipefail
          CFG="$RUNNER_TEMP/nv.cfg"
          MODEL="nvidia/llama-3.3-nemotron-super-49b-v1.5"
          CALLS=0
          MAX=2
          STRUCTURED_OUTPUT=FAIL

          # A rodada 2 (run 32188505706) devolveu HTTP 200 com content=null: o
          # modelo e de raciocinio e gastou os 128 tokens no bloco de reasoning.
          # A API aceitou json_schema, entao nao e ausencia de suporte. Aqui o
          # reasoning e desligado por system prompt e o orcamento e ampliado.
          tentar() {
            local tokens="$1"
            CALLS=$((CALLS + 1))
            if [ "$CALLS" -gt "$MAX" ]; then
              echo "teto de $MAX chamadas atingido: abortando" >&2
              exit 1
            fi
            local out="$RUNNER_TEMP/so.$CALLS.json"
            local meta="$RUNNER_TEMP/som.$CALLS.txt"
            local hdr="$RUNNER_TEMP/soh.$CALLS.txt"
            local body
            body="$(jq -nc --arg m "$MODEL" --argjson t "$tokens" '{
              model: $m, max_tokens: $t, temperature: 0,
              messages: [
                {role: "system", content: "/no_think"},
                {role: "user", content: "Extraia a intencao desta mensagem do municipe: quanto custa?"}
              ],
              response_format: {type: "json_schema", json_schema: {
                name: "intencao", strict: true,
                schema: {
                  type: "object", additionalProperties: false,
                  properties: {intencao: {type: "string", enum: ["PRECO", "DOCUMENTOS", "PRAZO", "OUTRO"]}},
                  required: ["intencao"]
                }
              }}
            }')"
            curl -K "$CFG" -o "$out" -D "$hdr" -w '%{http_code} %{time_total}\n' \
              --max-time 180 -X POST -H 'Content-Type: application/json' \
              -d "$body" "$BASE/chat/completions" > "$meta" || true
            local code tempo
            code="$(awk '{print $1}' "$meta")"
            tempo="$(awk '{print $2}' "$meta")"
            if [ -z "$code" ]; then
              echo "CHAMADA $CALLS sem resposta HTTP (falha de transporte)" >&2
              exit 1
            fi
            echo "CHAMADA $CALLS [structured max_tokens=$tokens] HTTP=$code latencia=${tempo}s"
            grep -iE '^(x-ratelimit|retry-after|ratelimit)' "$hdr" || true
            case "$code" in
              401 | 403)
                echo "FAIL-FAST: credencial rejeitada ($code)." >&2
                exit 1
                ;;
              429)
                echo "FAIL-FAST: rate limit ($code). Sem retry." >&2
                exit 1
                ;;
            esac
            echo "finish_reason: $(jq -r '.choices[0].finish_reason // "n/d"' "$out")"
            echo "usage: $(jq -c '.usage // "n/d"' "$out")"
            LAST_CODE="$code"
            LAST_OUT="$out"
          }

          # Os cinco criterios de PASS, avaliados em conjunto.
          validar() {
            [ "$LAST_CODE" = "200" ] || { echo "criterio: HTTP != 200"; return 1; }
            jq -e '.choices[0].message.content != null' "$LAST_OUT" > /dev/null 2>&1 ||
              { echo "criterio: content nulo"; return 1; }
            jq -e '.choices[0].message.content | fromjson' "$LAST_OUT" > /dev/null 2>&1 ||
              { echo "criterio: content nao e JSON parseavel"; return 1; }
            jq -e '.choices[0].message.content | fromjson | has("intencao")' "$LAST_OUT" > /dev/null 2>&1 ||
              { echo "criterio: campo intencao ausente"; return 1; }
            jq -e '.choices[0].message.content | fromjson | .intencao
                   | IN("PRECO", "DOCUMENTOS", "PRAZO", "OUTRO")' "$LAST_OUT" > /dev/null 2>&1 ||
              { echo "criterio: valor fora do enum"; return 1; }
            return 0
          }

          tentar 512
          if validar; then
            STRUCTURED_OUTPUT=PASS
            echo "CONTEUDO VALIDADO: $(jq -r '.choices[0].message.content' "$LAST_OUT")"
          else
            echo "chamada 1 nao satisfez os criterios; conteudo bruto abaixo"
            jq -c '.choices[0].message | {content, finish_reason: null}' "$LAST_OUT" 2> /dev/null | head -2 || true
            tentar 2048
            if validar; then
              STRUCTURED_OUTPUT=PASS
              echo "CONTEUDO VALIDADO: $(jq -r '.choices[0].message.content' "$LAST_OUT")"
            else
              echo "chamada 2 tambem nao satisfez os criterios"
              jq -c '.choices[0].message' "$LAST_OUT" 2> /dev/null | head -2 || true
            fi
          fi

          echo "=== RESULTADO ==="
          echo "MODELO: $MODEL"
          echo "STRUCTURED_OUTPUT=$STRUCTURED_OUTPUT"
          echo "=== CHAMADAS REAIS EXECUTADAS: $CALLS de $MAX ==="
          [ "$STRUCTURED_OUTPUT" = "PASS" ] || exit 1

      - name: Remover credencial
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          shred -u "$RUNNER_TEMP/nv.cfg" 2> /dev/null || rm -f "$RUNNER_TEMP/nv.cfg"
          echo "credencial removida do runner"
