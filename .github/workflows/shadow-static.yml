name: shadow-static
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - run: deno fmt --check edge-functions contracts tests
      - run: deno lint edge-functions contracts tests
      - run: deno check edge-functions/*/index.ts contracts/*.ts
      - run: deno test --allow-env --allow-read --no-net tests
      - run: tests/postgres/verify_migration_manifest.sh
      - run: test -x tests/postgres/run_all.sh && test -x tests/postgres/run_concurrency.sh && test -x tests/postgres/verify_static.sh && test -x tests/postgres/verify_migration_manifest.sh && bash -n tests/postgres/run_all.sh tests/postgres/run_concurrency.sh tests/postgres/verify_static.sh tests/postgres/verify_migration_manifest.sh && tests/postgres/verify_static.sh
      - run: '! rg -ni "TODO|IMPLEMENTAR|EXECUTAR MANUALMENTE|SIMULAR|select .+instruction" tests/postgres/p*.sql tests/postgres/run_*.sh'
      - run: '! rg -n "(postgres(ql)?://[^$[:space:]]+:[^$[:space:]]+@|SUPABASE_SERVICE_ROLE_KEY=|password=)" tests/postgres .github/workflows'
      - run: '! rg -n "support-flow-context|support-hybrid-router" edge-functions contracts && ! rg -n "service_\\*" edge-functions contracts'
      - run: '! rg -ni "fetch\\([^)]*(wapi|gemini)|https?://[^[:space:]]*(wapi|gemini)|SUPPORT_VNEXT_MODE.{0,40}ENABLED" edge-functions'
      - run: rg -q "p_classification_id" edge-functions/support-request-command/index.ts database/migrations/0008_5b2c4_final_static_blockers.sql
      - run: rg -q "persist_shadow_inbound_message" edge-functions/support-classifier/index.ts database/migrations/0008_5b2c4_final_static_blockers.sql
      # Static CI intentionally does not run migrations or PostgreSQL P01-P15.
