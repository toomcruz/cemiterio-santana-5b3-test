name: Santana MCP LAB controlled maintenance
run-name: Stage verified MCP LAB package without installing
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: santana-mcp-lab-maintenance
  cancel-in-progress: false
jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'toomcruz/cemiterio-santana-5b3-test'
    runs-on: [self-hosted, Linux, X64, hermes, omniroute-local]
    timeout-minutes: 3
    steps:
      - name: Stage encrypted package and verify original SHA-256
        shell: bash
        env:
          SANTANA_MCP_PACKAGE_KEY: ${{ secrets.SANTANA_MCP_PACKAGE_63A85C50 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,socket,subprocess,tempfile
          from pathlib import Path
          from urllib.request import build_opener,HTTPRedirectHandler
          if socket.gethostname().split('.')[0]!='srv1849463':raise SystemExit('UNEXPECTED_HOST')
          if os.environ.get('RUNNER_NAME')!='hermes-santana-lab':raise SystemExit('UNEXPECTED_RUNNER')
          key=os.environ.pop('SANTANA_MCP_PACKAGE_KEY','')
          if len(key)!=64:raise SystemExit('PACKAGE_KEY_UNAVAILABLE')
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*a,**k):return None
          url='https://raw.githubusercontent.com/toomcruz/cemiterio-santana-5b3-test/1e1c81ba6da953807c2cbe798f0f897913f8bd75/deploy/mcp-lab/package-63a85c50.enc.b64'
          with build_opener(NoRedirect).open(url,timeout=20) as r:encoded=r.read(300000)
          encrypted=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(encrypted).hexdigest()!='f3fc346a1103246f6446b5a17db291ec426e28ea72e745a16b7eb07776bdfefa':raise SystemExit('CIPHERTEXT_HASH_MISMATCH')
          fd,enc_path=tempfile.mkstemp(prefix='santana-mcp-transfer-')
          try:
              with os.fdopen(fd,'wb') as f:f.write(encrypted)
              p=subprocess.run(['openssl','enc','-d','-aes-256-cbc','-pbkdf2','-iter','200000','-in',enc_path,'-pass','stdin'],input=(key+'\n').encode(),capture_output=True,timeout=20)
              key=''
              if p.returncode:raise SystemExit('PACKAGE_DECRYPTION_FAILED')
              blob=p.stdout;expected='63a85c509957532a8091f0ad13b5a5423a0dfeb19a007310bac1f0943f27b6ee'
              if len(blob)>2097152 or hashlib.sha256(blob).hexdigest()!=expected:raise SystemExit('ORIGINAL_PACKAGE_HASH_MISMATCH')
              stage=Path.home()/'santana-mcp-staging'/expected[:16]
              for path in (stage.parent,stage):
                  if path.is_symlink():raise SystemExit('UNSAFE_STAGING_DIRECTORY')
                  path.mkdir(mode=0o700,exist_ok=True)
                  os.chmod(path,0o700)
              archive=stage/'WhatsApp-Santana-MCP-v5-Consolidado.zip'
              if archive.exists():
                  if archive.is_symlink() or hashlib.sha256(archive.read_bytes()).hexdigest()!=expected:raise SystemExit('UNSAFE_EXISTING_STAGING_FILE')
              else:
                  fd=os.open(archive,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
                  with os.fdopen(fd,'wb') as f:f.write(blob)
              print(json.dumps({'status':'STAGED_NOT_INSTALLED','path':str(archive),'sha256':expected,'bytes':len(blob),'service_changes':0,'production_changes':False,'secrets_printed':False},indent=2))
          finally:
              os.unlink(enc_path)
          PY
