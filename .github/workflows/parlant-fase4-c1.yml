name: Fase 4 - C1 preco (Parlant + Gemini)

# Disparador manual da POC. O workflow precisa estar na branch padrao para o
# botao "Run workflow" aparecer; todo o codigo executado vem da branch informada.
# Nao toca em Supabase, n8n, W-API, WhatsApp, Vercel ou producao.

on:
  workflow_dispatch:
    inputs:
      poc_ref:
        description: "Branch ou commit da POC isolada"
        required: true
        default: "claude/parlant-poc-gemini-bjab09"
        type: string
      rpm:
        description: "RPM declarado para a chave Gemini"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: parlant-fase4-c1-${{ inputs.poc_ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    name: Testes offline da POC
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/parlant-poc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.poc_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Rodar testes automatizados
        run: pytest -q

  c1-preco:
    name: C1 preco real com Gemini
    needs: offline-tests
    timeout-minutes: 45
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/parlant-poc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.poc_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verificar o secret sem expor valor
        env:
          GEMINI_API_KEY: ${{ secrets.PARLANT }}
        run: |
          set -Eeuo pipefail
          test -n "${GEMINI_API_KEY-}" || { echo "Secret PARLANT ausente."; exit 1; }
          echo "Secret PARLANT presente."

      - name: Executar somente C1-preco
        env:
          GEMINI_API_KEY: ${{ secrets.PARLANT }}
          POC_GEMINI_RPM: ${{ inputs.rpm }}
          POC_GEMINI_RETRIES_429: "0"
        run: python scripts/smoke_parlant.py --conversas C1-preco
