name: Fase 4 - C1 preco (Parlant + Gemini)

# Disparador manual da POC. O workflow precisa estar na branch padrao para o
# botao "Run workflow" aparecer; todo o codigo executado vem da branch informada.
# Nao toca em Supabase, n8n, W-API, WhatsApp, Vercel ou producao.

on:
  workflow_dispatch:
    inputs:
      poc_ref:
        description: "Branch ou commit da POC isolada"
        required: true
        default: "claude/parlant-poc-gemini-bjab09"
        type: string

permissions:
  contents: read

concurrency:
  group: parlant-fase4-c1-${{ inputs.poc_ref }}
  # Uma nova tentativa substitui a anterior para nao deixar execucoes presas.
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Testes offline da POC
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/parlant-poc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.poc_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Rodar testes automatizados
        run: pytest -q

  c1-preco:
    name: C1 preco real com Gemini (agente focado)
    needs: offline-tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/parlant-poc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.poc_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verificar o secret sem expor valor
        env:
          GEMINI_API_KEY: ${{ secrets.PARLANT }}
        run: |
          set -Eeuo pipefail
          test -n "${GEMINI_API_KEY-}" || { echo "Secret PARLANT ausente."; exit 1; }
          echo "Secret PARLANT presente."

      - name: Validar sintaxe da POC antes de consumir cota
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            santana_parlant_poc/agent/nlp.py \
            santana_parlant_poc/agent/build.py \
            scripts/serve_c1_price.py \
            scripts/smoke_parlant.py

      - name: Executar smoke C1-preco com limite de 6 minutos
        env:
          GEMINI_API_KEY: ${{ secrets.PARLANT }}
          PYTHONUNBUFFERED: "1"
          # Limite confirmado pela API para esta chave/modelo em 2026-08-23.
          POC_GEMINI_RPM: "3"
          POC_GEMINI_RETRIES_429: "0"
          # Limites internos com diagnóstico; evitam outra espera cega de 10 min.
          POC_C1_READY_TIMEOUT_S: "150"
          POC_C1_TURN_TIMEOUT_S: "180"
          POC_C1_STOP_TIMEOUT_S: "15"
        # `timeout` fica apenas como proteção final: o smoke agora informa em
        # qual fase parou e encerra o subprocesso do Parlant de forma limpa.
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 6m python scripts/smoke_parlant.py 2>&1 | tee smoke-c1.log
          status=${PIPESTATUS[0]}
          echo "===== Últimas linhas do smoke ====="
          tail -n 80 smoke-c1.log
          exit "${status}"
