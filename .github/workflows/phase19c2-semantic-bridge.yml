name: 19C.2 semantic bridge offline validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Validate semantic bridge formatting and types
        shell: bash
        run: |
          set -Eeuo pipefail
          deno fmt --check edge-functions/_shared/motor-v2-official-interpreter.ts \
            edge-functions/_shared/tests/motor-v2-official-interpreter_test.ts \
            santana-conversation-domain/runtime/interpreter/bridge.ts \
            santana-conversation-domain/runtime/interpreter/types.ts \
            santana-conversation-domain/motor-v2/providers/nvidia.ts
          deno lint edge-functions/_shared/motor-v2-official-interpreter.ts \
            edge-functions/_shared/tests/motor-v2-official-interpreter_test.ts \
            santana-conversation-domain/runtime/interpreter/bridge.ts \
            santana-conversation-domain/runtime/interpreter/types.ts
          deno check edge-functions/_shared/motor-v2-official-interpreter.ts \
            edge-functions/_shared/tests/motor-v2-official-interpreter_test.ts \
            santana-conversation-domain/runtime/interpreter/bridge.ts
      - name: Test semantic bridge and official transaction boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          deno test --allow-read edge-functions/_shared/tests/motor-v2-official-interpreter_test.ts
          deno test --allow-read santana-conversation-domain/runtime/tests
          deno test --allow-read santana-conversation-domain/motor-v2/tests/motor_v2_test.ts
          deno test --allow-read santana-conversation-domain/benchmark
          bash tests/postgres/verify_static.sh
      - name: Assert no production activation in this validation
        shell: bash
        run: |
          set -Eeuo pipefail
          if rg -n 'CANARY_ENABLED\\s*=\\s*true|CANARY_ENABLED=true' edge-functions santana-conversation-domain; then
            echo 'CANARY_ENABLED must remain false for Phase 19C.2' >&2
            exit 1
          fi
