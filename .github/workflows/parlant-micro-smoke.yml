name: Parlant micro-smoke

# Teste minimo e isolado do caminho real (Parlant + Gemini): 2 guidelines,
# 1 tool, 1 conversa. Nao toca em producao, migrations, Supabase, n8n, W-API,
# WhatsApp nem Vercel. Nao publica nada.

on:
  workflow_dispatch:
    inputs:
      conversas_extras:
        description: "Rodar as 10 conversas variadas se a primeira passar (1/0)"
        required: false
        default: "1"
        type: string
  push:
    branches:
      - "lab/**"
      - "claude/parlant-poc-**"
    paths:
      - "experiments/parlant-poc/scripts/micro_smoke.py"
      - ".github/workflows/parlant-micro-smoke.yml"

permissions:
  contents: read

concurrency:
  group: parlant-micro-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  micro-smoke:
    name: Micro-smoke Parlant + Gemini
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: experiments/parlant-poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-flight — uma unica chamada ao modelo (para em 404/429)
        env:
          GEMINI_API_KEY: ${{ secrets.PARLANT }}
          MODELO: gemini-3.1-flash-lite
        run: |
          set -Eeuo pipefail
          codigo=$(curl -sS -o /tmp/preflight.json -w '%{http_code}' \
            -X POST "https://generativelanguage.googleapis.com/v1beta/models/${MODELO}:generateContent" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"contents":[{"parts":[{"text":"responda apenas: ok"}]}]}')
          echo "HTTP ${codigo} para ${MODELO}"
          if [ "${codigo}" != "200" ]; then
            # Imprime so status e mensagem de erro; a chave nunca aparece.
            python -c "import json;d=json.load(open('/tmp/preflight.json')).get('error',{});print(d.get('status'),'-',d.get('message'))" || true
            echo "Modelo indisponivel ou sem cota: parando sem consumir mais chamadas."
            exit 1
          fi
          python -c "import json;d=json.load(open('/tmp/preflight.json'));print('resposta:', d['candidates'][0]['content']['parts'][0].get('text','').strip()[:80])"

      - name: Micro-smoke real — 1 conversa e, se passar, mais 10 variadas
        env:
          # A chave da POC entra na aplicacao apenas com este nome.
          GEMINI_API_KEY: ${{ secrets.PARLANT }}
          MICRO_PORT: "8802"
          # gemini-3.7-flash: 20 requisicoes por DIA no free tier.
          # familia 2.5 (pro/flash/flash-lite): 404 para chaves novas.
          # Resta a familia 3.x lite, com cota diaria maior.
          POC_GEMINI_MODEL: "gemini-3.1-flash-lite"
          # As 10 conversas extras so rodam se a primeira passar, no mesmo
          # servidor: reinicializar custaria a indexacao inteira de novo.
          MICRO_EXTRA: ${{ inputs.conversas_extras || '1' }}
        # -u: sem isso o stdout fica bufferizado no runner e, se o job
        # terminar antes do fim, o relatorio parcial se perde no buffer.
        run: python -u scripts/micro_smoke.py
