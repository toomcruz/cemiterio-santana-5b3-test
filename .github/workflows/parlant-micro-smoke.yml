name: Parlant micro-smoke

# Teste minimo e isolado do caminho real (Parlant + Gemini): 2 guidelines,
# 1 tool, 1 conversa. Nao toca em producao, migrations, Supabase, n8n, W-API,
# WhatsApp nem Vercel. Nao publica nada.

on:
  workflow_dispatch:
  push:
    branches:
      - "lab/**"
      - "claude/parlant-poc-**"
    paths:
      - "experiments/parlant-poc/scripts/micro_smoke.py"
      - ".github/workflows/parlant-micro-smoke.yml"

permissions:
  contents: read

concurrency:
  group: parlant-micro-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  micro-smoke:
    name: Micro-smoke Parlant + Gemini
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experiments/parlant-poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Micro-smoke (2 guidelines, 1 tool, 1 conversa)
        env:
          # A chave da POC entra na aplicacao apenas com este nome.
          GEMINI_API_KEY: ${{ secrets.PARLANT }}
          MICRO_PORT: "8802"
          # O free tier do gemini-3.7-flash da 20 requisicoes por DIA
          # (GenerateRequestsPerDayPerProjectPerModel-FreeTier), o que nao cobre
          # nem a indexacao de duas guidelines. O gemini-2.5-flash tem cota
          # diaria bem maior; o limite dele e por minuto (5), aplicado pelo
          # throttle padrao de agent/nlp.py — por isso nao ha override de RPM.
          POC_GEMINI_MODEL: "gemini-2.5-flash"
        run: python scripts/micro_smoke.py
