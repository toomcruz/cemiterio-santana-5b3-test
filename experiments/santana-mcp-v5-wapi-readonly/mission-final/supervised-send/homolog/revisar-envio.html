<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisar mensagem · Santana</title>
<style>body{font:16px/1.5 system-ui;color:#172421;background:#f2f7f4;margin:0;padding:24px}main{max-width:720px;margin:auto;background:white;padding:28px;border:1px solid #dbe4df;border-radius:16px}h1{font-size:1.6rem}label{display:block;margin-top:16px}input,button{font:inherit;padding:12px;box-sizing:border-box;width:100%;margin:6px 0;border:1px solid #b8c8c0;border-radius:8px}button{background:#176b50;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:default}.notice{padding:16px;background:#fff3d5;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f7f4;padding:16px}img,iframe{max-width:100%;width:100%;border:0}iframe{height:400px}dl{overflow-wrap:anywhere}dd{margin-left:0}dt{font-weight:700;margin-top:14px}[hidden]{display:none!important}</style>
<main><h1>Revisar uma mensagem</h1><p class="notice"><strong>Envio real bloqueado.</strong> Esta tela registra sua revisão pessoal em homologação. Nenhuma mensagem será enviada por ela.</p>
<form id="login"><label for="email">E-mail do operador existente</label><input id="email" type="email" autocomplete="username" required><label for="password">Sua senha</label><input id="password" type="password" autocomplete="current-password" required><button id="enter">Entrar para revisar</button></form>
<section id="preview" hidden><dl><dt>Destinatário autorizado</dt><dd id="recipient"></dd><dt>Conversa</dt><dd id="conversation"></dd><dt>Texto integral</dt></dl><pre id="text"></pre><div id="attachment"></div><details><summary>Conferência do conteúdo</summary><pre id="digest"></pre></details><label><input id="checked" type="checkbox" style="width:auto"> Conferi o destinatário, o texto integral e o anexo mostrado.</label><button id="approve" disabled>Registrar revisão — envio bloqueado</button></section><button id="prod" hidden>Autorizar uma tentativa no Painel oficial</button><p id="status" role="status" aria-live="polite"></p></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.118.0';
const auth=createClient('https://xdccjulfqcqefykunwtg.supabase.co','sb_publishable_doiDzLKISweiTWKlFYFG6w_0PZjP1vw',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);const id=location.hash.slice(1);let token=null,sha=null,blobURL=null;
const valid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id);
async function call(body){const r=await fetch('/api/send-intents',{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify({intent_id:id,...body})});const d=await r.json();if(!r.ok)throw Error(d.status||'review_unavailable');return d;}
$('login').onsubmit=async event=>{event.preventDefault();$('enter').disabled=true;try{const{data,error}=await auth.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error)throw Error(error.code||'authentication_failed');token=data.session.access_token;const d=await call({action:'human_preview'});sha=d.payload_sha256;const p=d.payload;$('recipient').textContent=(p.recipient.name||'Contato')+' · '+p.recipient.phone_mask;$('conversation').textContent=p.conversation_id;$('text').textContent=p.text;$('digest').textContent=sha;if(p.attachment&&d.attachment_base64){const bytes=Uint8Array.from(atob(d.attachment_base64),x=>x.charCodeAt(0));const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('');if(hash!==p.attachment.sha256||bytes.length!==p.attachment.size_bytes)throw Error('attachment_integrity_failed');const label=document.createElement('p');label.textContent=p.attachment.name+' · '+bytes.length+' bytes · SHA-256 '+hash;$('attachment').append(label);blobURL=URL.createObjectURL(new Blob([bytes],{type:p.attachment.mime_type}));const media=document.createElement(p.attachment.mime_type==='application/pdf'?'iframe':'img');media.src=blobURL;media.title=p.attachment.name;if(media.tagName==='IFRAME')media.setAttribute('sandbox','');$('attachment').append(media);} $('login').hidden=true;$('preview').hidden=false;$('prod').hidden=d.state!=='human_reviewed_dispatch_blocked';$('status').textContent=d.state==='prepared'?'Confira o conteúdo antes de registrar a revisão.':'Esta operação já foi revisada.';if(d.state!=='prepared')$('checked').disabled=true;}catch(error){token=null;$('password').value='';$('status').textContent='Não foi possível revisar: '+error.message+'. Nenhuma tentativa será repetida automaticamente.';}finally{$('enter').disabled=false;}};
$('checked').onchange=()=>{$('approve').disabled=!$('checked').checked||$('checked').disabled;};
$('approve').onclick=async()=>{$('approve').disabled=true;try{await call({action:'approve',payload_sha256:sha});$('checked').disabled=true;$('prod').hidden=false;$('status').textContent='Revisão registrada com sua sessão pessoal. O envio real permanece bloqueado.';}catch(error){$('status').textContent='Revisão não confirmada: '+error.message+'. Nenhuma mensagem foi enviada.';}};

let prodWindow=null,prodNonce=null;
$('prod').onclick=()=>{prodNonce=crypto.randomUUID();prodWindow=window.open('https://atendimento-cemiterio-santana.vercel.app/mcp-authorize?operation='+encodeURIComponent(id)+'#'+prodNonce,'santana-single-send-'+prodNonce);};
addEventListener('message',event=>{if(event.origin==='https://atendimento-cemiterio-santana.vercel.app'&&event.source===prodWindow&&event.data?.type==='santana-session-request'&&event.data.nonce===prodNonce&&token)prodWindow.postMessage({type:'santana-reviewed-session',nonce:prodNonce,token},'https://atendimento-cemiterio-santana.vercel.app');});

if(!valid){$('login').hidden=true;$('status').textContent='Preparação ausente. Abra o link de uma mensagem preparada pelo MCP.';}
addEventListener('pagehide',()=>{token=null;if(blobURL)URL.revokeObjectURL(blobURL);});
</script></html>
