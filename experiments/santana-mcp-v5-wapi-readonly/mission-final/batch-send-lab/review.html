<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisão única · Santana LAB</title>
<style>body{font:16px/1.5 system-ui;margin:24px;color:#17382f;background:#f4f7f5}main{max-width:840px;margin:auto}article{background:white;border:1px solid #cddbd4;border-radius:10px;padding:18px;margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:15px 22px;background:#176b50;color:white;border:0;border-radius:8px;font:inherit}img{max-width:100%;max-height:380px}iframe{width:100%;height:380px;border:0}label{display:block;padding:16px 0}[hidden]{display:none!important}</style>
<main><h1>Revisar mensagem ou lote</h1><p>LAB · contatos fictícios · nenhuma mensagem real será enviada.</p><p id="status" role="status">Carregando sua sessão de revisão…</p><section id="items"></section><form id="approval" hidden><label><input id="confirm" type="checkbox" required> Conferi todos os destinatários, mensagens e anexos. Aprovo exatamente este lote fictício.</label><button>Confirmar lote</button></form></main>
<script>
'use strict';const $=id=>document.getElementById(id),id=location.hash.slice(1);let preview,busy=false;
async function call(body){const r=await fetch('/lab/review',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:id,...body})});const v=await r.json();if(!r.ok)throw Error(v.error||'REVIEW_UNAVAILABLE');return v;}
function node(tag,text){const el=document.createElement(tag);el.textContent=text;return el;}
async function load(){try{preview=await call({action:'preview'});for(let i=0;i<preview.preview.length;i++){const p=preview.preview[i],a=document.createElement('article');a.append(node('h2',`${i+1}. ${p.name} · +${p.phone}`),node('pre',p.text),node('p',`Operação: ${p.operation_id} · ${preview.items[i].state}`));if(p.attachment){const m=preview.media[p.attachment.sha256],bytes=Uint8Array.from(atob(m.content_base64),x=>x.charCodeAt(0));const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('');if(hash!==p.attachment.sha256||bytes.length!==p.attachment.size_bytes)throw Error('ATTACHMENT_CHANGED');a.append(node('p',`${m.name} · ${m.mime_type} · ${m.size_bytes} bytes`));if(m.mime_type==='application/pdf'){const frame=document.createElement('iframe');frame.title=m.name;frame.setAttribute('sandbox','');frame.src=URL.createObjectURL(new Blob([bytes],{type:m.mime_type}));a.append(frame);}else{const img=document.createElement('img');img.alt=m.name;img.src='data:'+m.mime_type+';base64,'+m.content_base64;a.append(img);}}$('items').append(a);}$('status').textContent=`${preview.total} destinatário(s). Esta confirmação registra a revisão do lote integral.`;$('approval').hidden=preview.state!=='prepared';if(preview.state!=='prepared')$('status').textContent+=' Revisão já registrada; consulte o estado no ChatGPT.';}catch(e){$('status').textContent=e.message==='INDIVIDUAL_SESSION_REQUIRED'?'Sua sessão pessoal de revisão precisa ser autenticada no ambiente LAB. Não informe senha no chat.':'Revisão indisponível: '+e.message;}}
$('approval').onsubmit=async e=>{e.preventDefault();if(busy||!$('confirm').checked)return;busy=true;const button=$('approval').querySelector('button');button.disabled=true;try{await call({action:'approve',manifest_sha256:preview.manifest_sha256,csrf_nonce:preview.csrf_nonce,explicit:'approve_exact_synthetic_batch'});$('approval').hidden=true;$('status').textContent='Lote fictício aprovado. Volte ao ChatGPT para acompanhar a simulação. Nenhuma mensagem real foi enviada.';}catch(e){$('status').textContent='Confirmação não comprovada: '+e.message+'. Consulte o lote antes de tentar novamente.';}finally{busy=false;}};load();
</script></html>
