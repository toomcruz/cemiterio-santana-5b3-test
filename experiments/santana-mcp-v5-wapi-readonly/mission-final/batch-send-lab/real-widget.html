<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisão Santana LAB</title>
<style>body{font:15px/1.5 system-ui;color:#17382f;padding:12px}article{border-bottom:1px solid #dbe4df;padding:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}input,button{font:inherit;padding:12px;margin:6px 0;box-sizing:border-box}input[type=email],input[type=password],button{width:100%}button{background:#176b50;color:white;border:0;border-radius:8px}img{max-width:100%;max-height:350px}iframe{width:100%;height:350px;border:0}[hidden]{display:none!important}</style>
<h2>Revisão única · Santana LAB</h2><p>Somente contatos fictícios. Nenhum envio real.</p><p id="status" role="status">Aguardando a prévia autenticada do servidor.</p><section id="items"></section>
<form id="login" hidden><label>E-mail HOMOLOG<input id="email" type="email" autocomplete="username" required></label><label>Senha HOMOLOG<input id="password" type="password" autocomplete="current-password" required></label><button>Autenticar operador</button></form>
<form id="approval" hidden><label><input id="checked" type="checkbox" required> Conferi todos os destinatários, textos e anexos. Aprovo exatamente este lote fictício.</label><button id="approve">Confirmar lote</button></form><button id="logout" hidden>Encerrar sessão de revisão</button>
<script>
'use strict';const $=id=>document.getElementById(id);let meta,manifest,origin,serial=1,token=null,busy=false;const pending=new Map();
function host(method,params){const id=++serial;return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:'2.0',id,method,params},origin);setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(Error('HOST_RESPONSE_UNKNOWN'));}},15000);});}
const hash=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b))).map(x=>x.toString(16).padStart(2,'0')).join('');
function claims(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));}catch{return{};}}
function valid(t){const c=claims(t),a=c.amr?.find(x=>x.method==='password');return c.exp>Date.now()/1000+30&&a?.timestamp>Date.now()/1000-570&&!c.client_id&&!c.azp;}
async function render(m){if(!m?.canonical_manifest)return;meta=m;if(await hash(new TextEncoder().encode(meta.canonical_manifest))!==meta.manifest_sha256)throw Error('PREVIEW_INTEGRITY_FAILED');manifest=JSON.parse(meta.canonical_manifest);$('items').replaceChildren();for(const p of manifest.recipients){const a=document.createElement('article'),title=document.createElement('strong'),text=document.createElement('pre');title.textContent=p.name+' · +'+p.phone;text.textContent=p.text;a.append(title,text);if(p.attachment){const f=meta.media[p.attachment.sha256],bytes=Uint8Array.from(atob(f.content_base64),x=>x.charCodeAt(0));if(await hash(bytes)!==p.attachment.sha256||bytes.length!==p.attachment.size_bytes)throw Error('ATTACHMENT_CHANGED');const label=document.createElement('p');label.textContent=f.name+' · '+f.mime_type;a.append(label);const el=document.createElement(f.mime_type==='application/pdf'?'iframe':'img');if(el.tagName==='IFRAME')el.setAttribute('sandbox','');el.title=f.name;el.src=URL.createObjectURL(new Blob([bytes],{type:f.mime_type}));a.append(el);}$('items').append(a);}try{token=location.origin==='https://santana-mcp-homolog-consent.vercel.app'?sessionStorage.getItem('santana-lab-human'):null;}catch{}if(!valid(token)){token=null;$('login').hidden=false;$('approval').hidden=true;}else{$('login').hidden=true;$('approval').hidden=false;$('logout').hidden=false;}$('status').textContent=manifest.recipients.length+' destinatário(s) fictício(s). Revise o lote integral antes de confirmar.';}
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data?.jsonrpc!=='2.0')return;if(!origin)origin=e.origin;if(e.origin!==origin)return;const m=e.data;if(pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(Error(m.error.message)):p.resolve(m.result);return;}if(m.id===1){window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},origin);}if(m.method==='ui/notifications/tool-result')render(m.params?._meta?.lab_review).catch(x=>$('status').textContent=x.message);});
$('login').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{const r=await fetch(meta.auth_origin+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:meta.public_key,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});$('password').value='';const d=await r.json();if(!r.ok||!valid(d.access_token))throw Error(d.error_code||'AUTHENTICATION_FAILED');token=d.access_token;try{location.origin==='https://santana-mcp-homolog-consent.vercel.app'&&sessionStorage.setItem('santana-lab-human',token);}catch{}$('login').hidden=true;$('approval').hidden=false;$('logout').hidden=false;$('status').textContent='Sessão pessoal confirmada. Confira e aprove somente este lote.';}catch(x){$('status').textContent=x.message+'. Nenhuma tentativa de login será repetida automaticamente.';}finally{busy=false;$('password').value='';}};
$('approval').onsubmit=async e=>{e.preventDefault();if(busy||!$('checked').checked||!valid(token))return;busy=true;$('approve').disabled=true;try{const r=await fetch(meta.auth_origin+'/functions/v1/sana-mcp-read/lab-review',{method:'POST',headers:{apikey:meta.public_key,authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({canonical_manifest:meta.canonical_manifest,manifest_sha256:meta.manifest_sha256,challenge_nonce:meta.challenge_nonce,explicit:'approve_exact_synthetic_batch'})});const d=await r.json();if(!r.ok||d.status!=='approved_lab_only')throw Error(d.error||'REVIEW_NOT_CONFIRMED');const result=await host('tools/call',{name:'registrar_revisao_lote',arguments:{batch_id:manifest.batch_id,receipt_id:d.receipt_id}});if(result?.isError)throw Error('RECEIPT_NOT_REGISTERED');$('approval').hidden=true;$('status').textContent='Revisão autenticada registrada. O ChatGPT pode continuar a simulação deste lote. Nenhuma mensagem real foi enviada.';await host('ui/message',{role:'user',content:[{type:'text',text:'Concluí a revisão autenticada do lote fictício '+manifest.batch_id+'. Consulte seu estado e prossiga somente com a simulação.'}]});}catch(x){$('status').textContent=x.message+'. Consulte o lote antes de tentar novamente; não há reenvio automático.';}finally{busy=false;}};
$('logout').onclick=()=>{token=null;try{sessionStorage.removeItem('santana-lab-human');}catch{}$('approval').hidden=true;$('login').hidden=false;$('logout').hidden=true;$('status').textContent='Sessão local de revisão encerrada.';};
window.addEventListener('securitypolicyviolation',e=>{if(e.violatedDirective.startsWith('frame-src')){$('approval').hidden=true;$('checked').disabled=true;$('status').textContent='O cliente bloqueou a prévia do PDF. A aprovação deste anexo permanece bloqueada.';}});
window.parent.postMessage({jsonrpc:'2.0',id:1,method:'ui/initialize',params:{appInfo:{name:'santana-batch-lab',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'}},'*');
if(window.openai?.toolResponseMetadata?.lab_review)render(window.openai.toolResponseMetadata.lab_review).catch(x=>$('status').textContent=x.message);
</script></html>
